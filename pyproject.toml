[project]
name = "readurlist"
version = "0.2.0"
description = "ReadURList — saved URLs become a ranked reading corpus via Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[job-queue]>=21.0",
  "sqlalchemy>=2.0",
  "openai>=1.40",
  "trafilatura>=1.12",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
readurlist = "readurlist.main:main"
readurlist-digest = "readurlist.rank.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
